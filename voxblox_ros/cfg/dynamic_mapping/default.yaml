background:
  map:
    voxel_size: 0.2
    voxels_per_side: 8
  integrator:
    method: "fast"
    truncation_distance: 0.5
    max_ray_length_m: 100.0
    allow_clear: false

object:
  map:
    dynamic: true # Voxel size will be determined based on object size
    voxel_size: 0.05
    voxels_per_side: 8
  integrator:
    method: "fast"
    truncation_distance: 0.3
    max_ray_length_m: 100.0
    voxel_carving_enabled: false
    allow_clear: false

icp:
  enable: true
  icp_use_reciprocal_correspondences: true
  icp_max_correspondence_distance: 2
  icp_use_symmetric_objective: true
  icp_max_iterations: 100
  icp_transformation_epsilon: 0.000002
  icp_absolute_mse: 0.000000000001
  icp_euclidean_fitness_epsilon: 0.0001

meshing:
  color_mode: "lambert_color"
  update_mesh_every_n_sec: 1.0
  publish_mesh: true
  mesh_filename: "tpp_map.ply"
